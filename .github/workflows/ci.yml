name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - name: Format
        run: cargo fmt --all -- --check
      - name: Prepare verified FFmpeg
        run: ./scripts/prepare-ci-media.ps1
      - name: Build extensions and native host
        run: node scripts/prepare-sidecar.mjs
      - name: Frontend
        run: |
          pnpm --dir apps/desktop install --frozen-lockfile
          pnpm --dir apps/desktop typecheck
          pnpm --dir apps/desktop exec vite build
      - name: Clippy
        run: cargo clippy --workspace --all-targets
      - name: Tests
        env:
          CROWDM_MEDIA_TESTS: '1'
        run: |
          node --test extensions/tests/background.test.mjs
          cargo test --workspace
