[package]
name = "crowdm-host"
description = "Native messaging host that connects the CrowDM browser extensions to the desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "crowdm-host"
path = "src/main.rs"

[dependencies]
crowdm-ipc = { path = "../ipc" }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros", "io-util", "io-std", "net", "time", "sync"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_UI_WindowsAndMessaging",
] }
