[package]
name = "crowdm-desktop"
description = "CrowDM desktop application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "crowdm-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
crowdm-engine = { path = "../../../crates/engine" }
crowdm-ipc = { path = "../../../crates/ipc" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
tokio = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.8.1"
winreg = "0.56"
trash = "5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }
